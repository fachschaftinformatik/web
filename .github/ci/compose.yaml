services:
  app:
    image: ${APP_IMAGE:-ghcr.io/fachschaftinformatik/web:v0.0.0-test}
    tmpfs:
      - /data
    environment:
      S3_ENDPOINT: storage:9000
      S3_BUCKET: smoke
      S3_ACCESS_KEY: smoke-access-key
      S3_SECRET_KEY: smoke-secret-key
      AUTH_SECRET: smoke-auth-secret-for-disposable-tests-only
      INTERNAL_JWT_SECRET: smoke-jwt-secret-for-disposable-tests-only
      AUTH_URL: http://localhost
      DOMAIN: http://localhost
      SECURE_COOKIES: 'false'
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      interval: 1s
      start_period: 1s
      retries: 30

  # A minimal S3 startup fixture for bucket location and existence requests.
  storage:
    image: ${APP_IMAGE:-ghcr.io/fachschaftinformatik/web:v0.0.0-test}
    entrypoint: [node]
    command:
      - -e
      - |
        require('node:http').createServer((req, res) => {
          res.writeHead(200, {'Content-Type': 'application/xml', 'x-amz-bucket-region': 'us-east-1'});
          res.end('<LocationConstraint xmlns="http://s3.amazonaws.com/doc/2006-03-01/"/>');
        }).listen(9000, '0.0.0.0');
    healthcheck:
      test: [CMD, node, -e, "require('node:http').get('http://127.0.0.1:9000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 15
