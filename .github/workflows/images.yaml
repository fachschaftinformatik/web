name: Images

on:
  pull_request:
    branches: [main]
    paths:
      - .github/release/**
      - .github/workflows/release.yaml
      - .github/workflows/images.yaml
      - bake.hcl

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  images:
    name: Release images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build both release images without publishing
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        env:
          RELEASE_TAG: v0.0.0-test
        with:
          files: bake.hcl
          set: '*.output=type=cacheonly'
