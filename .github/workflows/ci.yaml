name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate
        run: go generate ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -v ./...

  website:
    name: website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Generate API spec
        run: go generate ./...
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: website
      - name: Type check
        run: bun run check
        working-directory: website
      - name: Lint
        run: bun run lint
        working-directory: website
      - name: Build
        run: bun run build
        working-directory: website
