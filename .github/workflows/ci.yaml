name: ci:app

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview the next release without publishing
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-go:
    name: test:go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l main.go internal)"
      - run: go vet ./...
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: shellcheck tools/*.sh
      - name: Verify generated database queries
        run: |
          go generate ./internal/data
          git diff --exit-code -- internal/data
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  codeql:
    name: security:codeql (${{ matrix.language }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript, actions]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
          queries: security-extended
      - run: go build ./...
        if: matrix.language == 'go'
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  security-dependencies:
    name: security:dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never

  security-release:
    name: security:release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .github/release
      - run: bun run audit
        working-directory: .github/release

  build-app:
    name: build:app
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        env:
          RELEASE_TAG: v0.0.0-test
        with:
          files: bake.hcl
          targets: app
          set: '*.output=type=cacheonly'

  check:
    name: release:check
    if: always()
    needs: [test-go, codeql, security-dependencies, security-release, build-app]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all applicable checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Check results: $RESULTS"
          [[ "$RESULTS" != *failure* && "$RESULTS" != *cancelled* ]]

  publish:
    name: release:publish
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .github/release
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Expose Buildx cache credentials
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - name: Publish release
        id: semantic-release
        working-directory: .github/release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            bun run release --dry-run
          else
            bun run release
          fi
      - name: Select published release for image aliases
        id: aliases
        if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.semantic-release.outputs.tag }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          fi
          if [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$GITHUB_SHA" ]]; then
            printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Attach release SBOM
        if: steps.aliases.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ steps.aliases.outputs.tag }}
        run: |
          SBOM_FILE="$RUNNER_TEMP/${GITHUB_REPOSITORY##*/}-$RELEASE_TAG.sbom.spdx.json"
          docker buildx imagetools inspect "$IMAGE_PREFIX:$RELEASE_TAG" \
            --format '{{ json .SBOM.SPDX }}' > "$SBOM_FILE"
          jq -e '.spdxVersion and .SPDXID == "SPDXRef-DOCUMENT"' "$SBOM_FILE" > /dev/null
          gh release upload "$RELEASE_TAG" "$SBOM_FILE" --clobber
      - name: Promote latest image alias
        if: steps.aliases.outputs.tag != ''
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ steps.aliases.outputs.tag }}
        run: |
          docker buildx imagetools inspect "$IMAGE_PREFIX:$RELEASE_TAG"
          docker buildx imagetools create --tag "$IMAGE_PREFIX:latest" "$IMAGE_PREFIX:$RELEASE_TAG"
