name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.scope.outputs.api }}
      website: ${{ steps.scope.outputs.website }}
      workflows: ${{ steps.scope.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            printf 'api=true\nwebsite=true\nworkflows=true\n' >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only -z "$BASE_SHA...$HEAD_SHA" | bash .github/ci.sh >> "$GITHUB_OUTPUT"
          else
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | bash .github/ci.sh >> "$GITHUB_OUTPUT"
          fi

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate
        run: go generate ./...
      - name: Check generated backend and API spec
        run: git diff --exit-code -- docs internal/database
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -v ./...

  website:
    name: website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('website/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Next.js compiler
        uses: actions/cache@v5
        with:
          path: website/.next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('website/bun.lock', '.node-version') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('website/bun.lock', '.node-version') }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: website
      - name: Check generated API client
        run: |
          bun run gen:api
          git diff --exit-code -- src/lib/api
        working-directory: website
      - name: Type check
        run: bun run check
        working-directory: website
      - name: Lint
        run: bun run lint
        working-directory: website
      - name: Build
        run: bun run build
        working-directory: website

  workflows:
    name: workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
