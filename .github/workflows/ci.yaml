name: ci:app

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview the next version without publishing images or a release
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: release:plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.mode.outputs.full == 'true' || steps.changes.outputs.shared == 'true' || steps.changes.outputs.api == 'true' }}
      website: ${{ steps.mode.outputs.full == 'true' || steps.changes.outputs.shared == 'true' || steps.changes.outputs.website == 'true' }}
      generated: ${{ steps.mode.outputs.full == 'true' || steps.changes.outputs.shared == 'true' || steps.changes.outputs.generated == 'true' }}
      workflows: ${{ steps.mode.outputs.full == 'true' || steps.changes.outputs.shared == 'true' }}
      release_tools: ${{ steps.mode.outputs.full == 'true' || steps.changes.outputs.shared == 'true' || steps.changes.outputs.release_tools == 'true' }}
      dependencies: ${{ steps.mode.outputs.full == 'true' || steps.changes.outputs.shared == 'true' || steps.changes.outputs.dependencies == 'true' }}
      app: ${{ steps.mode.outputs.full == 'true' || steps.changes.outputs.shared == 'true' || steps.changes.outputs.app == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select full verification for scheduled and manual runs
        id: mode
        env:
          FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: printf 'full=%s\n' "$FULL" >> "$GITHUB_OUTPUT"
      - name: Select applicable checks from changed paths
        id: changes
        if: steps.mode.outputs.full != 'true'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          base: ${{ github.event.before || github.event.pull_request.base.sha }}
          filters: |
            shared:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/ci/**'
            api:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'database/**'
            website:
              - 'website/**'
              - 'docs/**'
              - '.node-version'
            generated:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'database/**'
              - 'docs/**'
              - 'website/openapi-ts.config.ts'
              - 'website/src/lib/api/**'
              - 'website/package.json'
              - 'website/bun.lock'
              - '.node-version'
            release_tools:
              - '.github/release/**'
              - '.node-version'
            app:
              - 'Dockerfile'
              - '.dockerignore'
              - 'bake.hcl'
              - 'compose.yaml'
              - 'garage.toml'
              - 'docker/**'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'database/**'
              - 'website/**'
              - 'docs/**'
              - '.node-version'
              - '.github/release/**'
            dependencies:
              - 'go.mod'
              - 'go.sum'
              - 'website/package.json'
              - 'website/bun.lock'
              - '.github/release/package.json'
              - '.github/release/bun.lock'
              - 'Dockerfile'
              - '.node-version'

  lint-api:
    name: lint:api
    needs: plan
    if: needs.plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          scope: lint-api
      - run: go vet ./...

  lint-app:
    name: lint:app
    needs: plan
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: shellcheck docker/*.sh docker/services/*/run

  lint-website:
    name: lint:website
    needs: plan
    if: needs.plan.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          directory: website
      - run: bun run check && bun run lint
        working-directory: website

  lint-workflows:
    name: lint:workflows
    needs: plan
    if: needs.plan.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          scope: lint-workflows
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  test-api:
    name: test:api
    needs: plan
    if: needs.plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          scope: test-api
      - name: Check generated Go and OpenAPI files
        run: |
          go generate ./...
          git diff --exit-code -- docs internal/database
      - run: go test ./...

  test-website:
    name: test:website
    needs: plan
    if: needs.plan.outputs.generated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          directory: website
      - name: Check generated API client
        working-directory: website
        run: |
          bun run gen:api
          git diff --exit-code -- src/lib/api

  test-release-tools:
    name: test:release
    needs: plan
    if: needs.plan.outputs.release_tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          directory: .github/release
          ignore-scripts: 'true'
      - run: bun run test
        working-directory: .github/release

  security-api:
    name: security:api
    needs: plan
    if: needs.plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          scope: security-api
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
          queries: security-extended
      - run: go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  security-website:
    name: security:website
    needs: plan
    if: needs.plan.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun audit --audit-level=high
        working-directory: website

  security-workflows:
    name: security:workflows
    needs: plan
    if: needs.plan.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions

  security-dependencies:
    name: security:dependencies
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never

  security-release-tools:
    name: security:release
    needs: plan
    if: needs.plan.outputs.release_tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          directory: .github/release
          ignore-scripts: 'true'
      - run: bun run audit
        working-directory: .github/release

  build-app:
    name: build:app
    needs: plan
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build application image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        env:
          RELEASE_TAG: v0.0.0-test
        with:
          files: bake.hcl
          targets: app
          set: '*.output=type=cacheonly'

  test-app:
    name: test:app
    needs: [plan, build-app]
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_IMAGE: ghcr.io/${{ github.repository }}:v0.0.0-test
      COMPOSE_FILE: .github/ci/compose.yaml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Load the cached application image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        env:
          RELEASE_TAG: v0.0.0-test
        with:
          files: bake.hcl
          targets: app
          load: true
          set: '*.cache-to='
      - name: Start disposable application and storage fixtures
        run: docker compose up --wait --wait-timeout 60
      - name: Test frontend, API proxy, and Swagger
        run: |
          for path in /team /api/v1/office-status /swagger/index.html; do
            docker compose exec -T app wget -q -O /dev/null "http://127.0.0.1$path"
          done
      - name: Test native image processing as the website user
        run: |
          docker compose exec -T --user 1001:1001 -w /app/website app node -e '
            require("sharp")({create: {width: 2, height: 2, channels: 3, background: "#000"}})
              .png().toBuffer().then(b => { if (!b.length) process.exit(1); })
              .catch(e => { console.error(e); process.exit(1); });
          '
      - name: Test graceful shutdown
        run: |
          docker compose stop --timeout 10 app
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq app)")" = 0
      - name: Show runtime logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 60
      - name: Remove disposable fixtures
        if: always()
        run: docker compose down --volumes --remove-orphans

  check:
    name: release:check
    if: always()
    needs:
      - plan
      - lint-api
      - lint-app
      - lint-website
      - lint-workflows
      - test-api
      - test-app
      - test-website
      - test-release-tools
      - security-api
      - security-website
      - security-workflows
      - security-dependencies
      - security-release-tools
      - build-app
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every applicable check to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Check results: $RESULTS"
          [[ "$PLAN_RESULT" == success && "$RESULTS" != *failure* && "$RESULTS" != *cancelled* ]]

  publish:
    name: release:publish
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    outputs:
      released: ${{ steps.semantic-release.outputs.released }}
      tag: ${{ steps.semantic-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          directory: .github/release
          ignore-scripts: 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Expose Buildx cache credentials
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - name: Publish release
        id: semantic-release
        working-directory: .github/release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            bun run release --dry-run
          else
            bun run release
          fi
      - name: Select published release for image aliases
        id: aliases
        if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.semantic-release.outputs.tag }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          fi
          if [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$GITHUB_SHA" ]]; then
            printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Attach release SBOM
        if: steps.aliases.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ steps.aliases.outputs.tag }}
        run: |
          SBOM_FILE="$RUNNER_TEMP/${GITHUB_REPOSITORY##*/}-$RELEASE_TAG.sbom.spdx.json"
          docker buildx imagetools inspect "$IMAGE_PREFIX:$RELEASE_TAG" \
            --format '{{ json .SBOM.SPDX }}' > "$SBOM_FILE"
          jq -e '.spdxVersion and .SPDXID == "SPDXRef-DOCUMENT"' "$SBOM_FILE" > /dev/null
          gh release upload "$RELEASE_TAG" "$SBOM_FILE" --clobber
      - name: Promote latest image aliases
        if: steps.aliases.outputs.tag != ''
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ steps.aliases.outputs.tag }}
        run: |
          docker buildx imagetools inspect "$IMAGE_PREFIX:$RELEASE_TAG"
          docker buildx imagetools create \
            --tag "$IMAGE_PREFIX:latest" \
            "$IMAGE_PREFIX:$RELEASE_TAG"
