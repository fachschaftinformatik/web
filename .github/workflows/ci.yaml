name: ci:app

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview the next release without publishing
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-go:
    name: test:go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Configure Go caches
        run: |
          printf 'GOCACHE=%s/go-build\nGOMODCACHE=%s/go-mod\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Cache Go modules and builds
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-v1-${{ hashFiles('go.mod', 'go.sum', 'flake.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-v1-${{ hashFiles('go.mod', 'go.sum', 'flake.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-v1-
      - run: |
          formatting=$(nix develop -c gofmt -l ./*.go internal model site storage view)
          test -z "$formatting"
      - run: nix develop -c go vet ./...
      - run: nix develop -c go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Verify generated database queries
        run: |
          nix develop -c go generate ./internal/database
          git diff --exit-code -- internal/database
      - name: Verify dependency hashes
        run: nix develop -c node .github/renovate/update-locks.mjs --assets --go --check
      - name: Race tests and coverage
        run: nix develop -c env TMPDIR="$RUNNER_TEMP" go test -race -coverprofile="$RUNNER_TEMP/coverage.out" ./...
      - name: Report coverage
        run: |
          nix develop -c go tool cover -html="$RUNNER_TEMP/coverage.out" -o "$RUNNER_TEMP/coverage.html"
          {
            echo '## Coverage'
            echo 'Download the coverage artifact for the HTML report and profile.'
            echo '```text'
            nix develop -c go tool cover -func="$RUNNER_TEMP/coverage.out" | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            ${{ runner.temp }}/coverage.out
            ${{ runner.temp }}/coverage.html
          if-no-files-found: error
      - run: nix develop -c go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test-assets:
    name: test:assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - run: nix flake check --print-build-logs

  codeql:
    name: security:codeql (${{ matrix.language }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript, actions]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        if: matrix.language == 'go'
      - run: nix run .#vendor
        if: matrix.language == 'go'
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
          queries: security-extended
      - run: go build ./...
        if: matrix.language == 'go'
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}

  security-dependencies:
    name: security:dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never

  security-release:
    name: security:release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .github/release
      - run: bun run audit
        working-directory: .github/release

  build-go:
    name: build:go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            keep-outputs = true
            keep-derivations = true
      - name: Cache Nix build dependencies
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'go.mod', 'go.sum') }}-${{ github.sha }}
          restore-prefixes-first-match: |
            nix-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'go.mod', 'go.sum') }}-
            nix-image-v1-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 2G
      - name: Build application image once
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          nix build .#image --out-link "$RUNNER_TEMP/image"
          # Preserve Docker healthcheck metadata in the OCI layout.
          nix shell --inputs-from . nixpkgs#skopeo -c skopeo --insecure-policy copy --format v2s2 \
            "docker-archive:$RUNNER_TEMP/image" "oci:$RUNNER_TEMP/release/image:web"
          nix shell --inputs-from . nixpkgs#skopeo -c skopeo inspect \
            --format '{{.Digest}}' "oci:$RUNNER_TEMP/release/image:web" \
            > "$RUNNER_TEMP/release/image-digest"
      - name: Scan application image
        run: |
          docker run --rm -v "$RUNNER_TEMP/release:/release:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$TRIVY_IMAGE" \
            image --input /release/image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1
      - name: Generate image SBOM
        run: |
          docker run --rm -v "$RUNNER_TEMP/release:/release" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$TRIVY_IMAGE" \
            image --input /release/image --format spdx-json --scanners vuln \
            --output /release/web.sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  check:
    name: release:check
    if: always()
    needs: [test-go, test-assets, codeql, security-dependencies, security-release, build-go]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all applicable checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Check results: $RESULTS"
          [[ "$RESULTS" != *failure* && "$RESULTS" != *cancelled* ]]

  publish:
    name: release:publish
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.12.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .github/release
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image
          path: ${{ runner.temp }}/release
      - name: Publish release
        id: semantic-release
        working-directory: .github/release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          RELEASE_ARTIFACT: ${{ runner.temp }}/release
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            nix shell --inputs-from ../.. nixpkgs#skopeo nixpkgs#oras -c bun run release --dry-run
          else
            nix shell --inputs-from ../.. nixpkgs#skopeo nixpkgs#oras -c bun run release
          fi
      - name: Select published release for image aliases
        id: aliases
        if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.semantic-release.outputs.tag }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          fi
          if [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$GITHUB_SHA" ]]; then
            printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Attach release SBOM
        if: steps.aliases.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ steps.aliases.outputs.tag }}
        run: |
          SBOM_FILE="$RUNNER_TEMP/${GITHUB_REPOSITORY##*/}-$RELEASE_TAG.sbom.spdx.json"
          cp "$RUNNER_TEMP/release/web.sbom.spdx.json" "$SBOM_FILE"
          jq -e '.spdxVersion and .SPDXID == "SPDXRef-DOCUMENT"' "$SBOM_FILE" > /dev/null
          gh release upload "$RELEASE_TAG" "$SBOM_FILE" --clobber
      - name: Promote latest image alias
        if: steps.aliases.outputs.tag != ''
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ steps.aliases.outputs.tag }}
        run: |
          DIGEST=$(cat "$RUNNER_TEMP/release/image-digest")
          nix shell --inputs-from . nixpkgs#skopeo -c skopeo --insecure-policy copy --preserve-digests \
            --authfile "$HOME/.docker/config.json" \
            "docker://$IMAGE_PREFIX@$DIGEST" "docker://$IMAGE_PREFIX:latest"
