name: ci:v2

on:
  push:
    branches: ['v2/**']
  pull_request:
    paths:
      - 'cmd/web-demo/**'
      - 'internal/webdemo/**'
      - 'tools/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/v2.yaml'
      - '.github/actions/setup-go/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test:v2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          scope: v2
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd/web-demo internal/webdemo)"
      - name: Vet domain and HTTP packages
        run: go vet ./internal/webdemo/... ./cmd/web-demo
      - name: Test domain operations and HTTP journeys
        run: go test -race ./internal/webdemo/... ./cmd/web-demo
      - name: Build the Go application
        run: go build -trimpath -o "$RUNNER_TEMP/web-v2" ./cmd/web-demo
