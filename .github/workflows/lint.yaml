name: ci:lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: lint:commit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|test|perf|build|ci|chore|style|revert)(\([a-z0-9][a-z0-9./_-]*\))?!?: [^[:cntrl:]]+$'
          if [[ ! "$PR_TITLE" =~ $pattern || "$PR_TITLE" != "${PR_TITLE,,}" ]]; then
            echo 'Use a lowercase Conventional Commit title, e.g. fix: correct event pagination'
            exit 1
          fi
