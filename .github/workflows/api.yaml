name: API CI

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - database/**
      - internal/**
      - Dockerfile
      - bake.hcl
      - .dockerignore
      - compose.yaml
      - garage.toml
      - .github/workflows/api.yaml
      - .github/workflows/release.yaml
  workflow_dispatch:
  workflow_call:

concurrency:
  group: api-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate
        run: go generate ./...
      - name: Check generated files
        run: git diff --exit-code -- docs internal/database
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -v ./...
