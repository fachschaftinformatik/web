name: Set up cached Bun dependencies
description: Set up Node and Bun and install a component's locked dependencies.
inputs:
  directory:
    description: Directory containing package.json and bun.lock.
    required: true
  ignore-scripts:
    description: Disable dependency lifecycle scripts.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: latest
    - name: Cache Bun downloads
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/bun.lock', inputs.directory)) }}
        restore-keys: |
          bun-${{ runner.os }}-${{ runner.arch }}-
    - name: Install locked dependencies
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        if [[ "$IGNORE_SCRIPTS" == true ]]; then
          bun install --frozen-lockfile --ignore-scripts
        else
          bun install --frozen-lockfile
        fi
