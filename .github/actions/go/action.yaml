name: Set up cached Go
description: Restore modules and a rolling build cache isolated by job purpose.
inputs:
  scope:
    description: Build-cache namespace for this job.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: false
    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        printf 'build=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
    - name: Cache Go modules
      id: modules
      uses: actions/cache@v6
      with:
        path: ${{ steps.paths.outputs.modules }}
        key: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
    - name: Download all module dependencies, including generators
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: go mod download
    - name: Cache Go build and tools
      uses: actions/cache@v6
      with:
        path: ${{ steps.paths.outputs.build }}
        key: go-build-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
          go-build-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-
