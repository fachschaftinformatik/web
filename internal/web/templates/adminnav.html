{{define "admin-navigation"}}
<nav class="app-section-nav" aria-label="Seiten der Verwaltung">
  <h2 class="app-subnav-theme">Verwaltung</h2>
  <ul class="govuk-list app-subnav">
    {{if not .Admin.ReviewerOnly}}<li><a class="govuk-link govuk-link--no-visited-state govuk-link--no-underline" href="/verwaltung" {{if eq .Admin.Section ""}}aria-current="page"{{end}}>Übersicht</a></li>{{end}}
    {{range .Admin.Links}}<li><a class="govuk-link govuk-link--no-visited-state govuk-link--no-underline" href="{{.URL}}" {{if eq $.Admin.Section .ID}}aria-current="{{if or (eq $.Admin.View "form") (eq $.Admin.View "user") (eq $.Admin.View "review") (eq $.Admin.View "reset")}}true{{else}}page{{end}}"{{end}}>{{.Label}}</a></li>{{end}}
  </ul>
</nav>
{{end}}
