{{define "upload-scope"}}
<div class="govuk-form-group {{if .Error}}govuk-form-group--error{{end}}"><fieldset class="govuk-fieldset" {{if .Error}}aria-describedby="{{.ID}}-error"{{end}}>
  <legend class="govuk-fieldset__legend govuk-fieldset__legend--m">{{.Label}}</legend>
  {{if .Error}}<p class="govuk-error-message" id="{{.ID}}-error"><span class="govuk-visually-hidden">Fehler:</span> {{.Error}}</p>{{end}}
  <div class="govuk-checkboxes govuk-checkboxes--small" data-module="govuk-checkboxes">{{range $index,$option:=.Options}}<div class="govuk-checkboxes__item"><input class="govuk-checkboxes__input" id="{{$.ID}}-{{$index}}" name="{{$.ID}}" type="checkbox" value="{{.Name}}" {{if .Selected}}checked{{end}}><label class="govuk-label govuk-checkboxes__label" for="{{$.ID}}-{{$index}}">{{if eq $.ID "version"}}{{poLabel .Name}}{{else}}{{.Name}}{{end}}</label></div>{{end}}</div>
</fieldset></div>
{{end}}
