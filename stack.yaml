# Deploy the app alongside the existing Garage service. Do not use --prune
# until the old API and website services have been retired explicitly.
services:
  app:
    image: ghcr.io/fachschaftinformatik/web:${RELEASE_TAG:?Set RELEASE_TAG}
    command: ["-addr", "0.0.0.0:8080", "-database", "/data/sqlite.db"]
    volumes:
      - type: bind
        source: /srv/fsinformatik/data
        target: /data
    networks:
      - caddy
      - storage
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      S3_ENDPOINT: ${S3_ENDPOINT:-garage:3900}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    stop_grace_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
      restart_policy:
        condition: on-failure
        delay: 5s

networks:
  caddy:
    external: true
    name: caddy
  storage:
    external: true
    name: fsinformatik_api
