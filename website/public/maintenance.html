<!DOCTYPE html>
<html lang="de" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wartungsmodus | FSV Informatik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;700&display=swap" />
    <style>
        :root[data-theme="dark"] {
            --primary: #3ee29b;
            --primary-dark: #24b87b;
            --primary-contrast: #0b1511;
            --bg: #0c1411;
            --bg-gradient: linear-gradient(120deg, rgba(47, 121, 87, 0.2) 0%, rgba(12, 20, 17, 1) 100%);
            --card-bg: rgba(15, 16, 23, 0.82);
            --text-primary: #f6f9f6;
            --text-secondary: #9aaea3;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: rgba(0, 0, 0, 0.35);
        }

        :root[data-theme="light"] {
            --primary: #2f7957;
            --primary-dark: #226244;
            --primary-contrast: #ffffff;
            --bg: #f5f5f5;
            --bg-gradient: linear-gradient(120deg, rgba(61, 164, 116, 0.1) 0%, rgba(245, 245, 245, 1) 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-primary: #1f1f1f;
            --text-secondary: #5c5c5c;
            --border: rgba(31, 31, 31, 0.1);
            --shadow: rgba(47, 121, 87, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background-color: var(--bg);
            background-image: var(--bg-gradient);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 80px;
            height: 80px;
            background-color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 32px var(--shadow);
        }

        .avatar svg {
            width: 40px;
            height: 40px;
            fill: var(--primary-contrast);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 26px 60px var(--shadow);
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: var(--primary-contrast);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            font-family: 'Manrope', sans-serif;
        }

        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--shadow);
        }

        .theme-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--primary);
            color: var(--primary-contrast);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px var(--shadow);
            z-index: 100;
            transition: transform 0.2s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .theme-toggle svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        #sun-icon {
            display: none;
        }

        [data-theme="dark"] #sun-icon {
            display: block;
        }

        [data-theme="light"] #moon-icon {
            display: block;
        }

        [data-theme="light"] #sun-icon {
            display: none;
        }

        [data-theme="dark"] #moon-icon {
            display: none;
        }
    </style>
</head>

<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="Farbschema wechseln">
        <svg id="moon-icon" viewBox="0 0 24 24">
            <path
                d="M12,3c-4.97,0-9,4.03-9,9s4.03,9,9,9s9-4.03,9-9c0-0.46-0.04-0.92-0.1-1.36c-0.98,1.37-2.58,2.26-4.4,2.26 c-2.98,0-5.4-2.42-5.4-5.4c0-1.81,0.89-3.42,2.26-4.4C12.92,3.04,12.46,3,12,3L12,3z" />
        </svg>
        <svg id="sun-icon" viewBox="0 0 24 24">
            <path
                d="M12,7c-2.76,0-5,2.24-5,5s2.24,5,5,5s5-2.24,5-5S14.76,7,12,7L12,7z M2,13l2,0c0.55,0,1-0.45,1-1s-0.45-1-1-1l-2,0 c-0.55,0-1,0.45-1,1S1.45,13,2,13z M20,13l2,0c0.55,0,1-0.45,1-1s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S19.45,13,20,13z M11,2l0,2 c0,0.55,0.45,1,1,1s1-0.45,1-1l0-2c0-0.55-0.45-1-1-1S11,1.45,11,2z M11,20l0,2c0,0.55,0.45,1,1,1s1-0.45,1-1l0-2 c0-0.55-0.45-1-1-1S11,19.45,11,20z M5.64,4.22c-0.39-0.39-1.02-0.39-1.41,0c-0.39,0.39-0.39,1.02,0,1.41l1.41,1.41 c0.39,0.39,1.02,0.39,1.41,0c0.39-0.39,0.39-1.02,0-1.41L5.64,4.22z M18.36,16.95c-0.39-0.39-1.02-0.39-1.41,0 c-0.39,0.39-0.39,1.02,0,1.41l1.41,1.41c0.39,0.39,1.02,0.39,1.41,0c0.39-0.39,0.39-1.02,0-1.41L18.36,16.95z M18.36,4.22 l-1.41,1.41c-0.39,0.39-0.39,1.02,0,1.41c0.39,0.39,1.02,0.39,1.41,0l1.41-1.41c0.39-0.39,0.39-1.02,0-1.41 C19.39,3.83,18.75,3.83,18.36,4.22z M5.64,16.95l-1.41,1.41c-0.39,0.39-0.39,1.02,0,1.41c0.39,0.39,1.02,0.39,1.41,0l1.41-1.41 c0.39-0.39,0.39-1.02,0-1.41C7.05,16.56,6.41,16.56,5.64,16.95z" />
        </svg>
    </button>

    <div class="container">
        <div class="avatar">
            <svg viewBox="0 0 24 24">
                <path
                    d="M22.7,19L13.6,3.4C13.2,2.8,12.6,2.4,12,2.4s-1.2,0.4-1.6,1L1.3,19c-0.4,0.6-0.4,1.4,0,2c0.4,0.6,1,1,1.7,1h18.2c0.7,0,1.3-0.4,1.7-1C23.1,20.4,23.1,19.6,22.7,19z M12,18c-0.6,0-1-0.4-1-1s0.4-1,1-1s1,0.4,1,1S12.6,18,12,18z M13,14h-2V9h2V14z" />
            </svg>
        </div>
        <div class="card">
            <h1>Wartungsarbeiten</h1>
            <p>Wir führen aktuell wichtige Wartungsarbeiten durch. Wir sind in Kürze wieder da.</p>
            <button class="btn" onclick="window.location.reload()">Seite neu laden</button>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        const STORAGE_KEY = 'app-theme-mode';

        // Load theme from localStorage
        const storedTheme = localStorage.getItem(STORAGE_KEY);
        if (storedTheme) {
            html.setAttribute('data-theme', storedTheme);
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            html.setAttribute('data-theme', 'light');
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem(STORAGE_KEY, newTheme);
        });
    </script>
</body>

</html>
