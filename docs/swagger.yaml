basePath: /api
definitions:
  dto.ActivityResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      target_id:
        type: string
      target_name:
        type: string
      type:
        type: string
      user_id:
        type: string
      user_name:
        type: string
    type: object
  dto.CommentRequest:
    properties:
      parent_id:
        type: string
      text:
        maxLength: 2000
        minLength: 1
        type: string
    required:
    - text
    type: object
  dto.CommentResponse:
    properties:
      author_avatar_url:
        type: string
      author_id:
        type: string
      author_name:
        type: string
      created_at:
        type: string
      id:
        type: string
      parent_id:
        type: string
      post_id:
        type: string
      text:
        type: string
      updated_at:
        type: string
      user_vote:
        type: integer
      votes:
        type: integer
    type: object
  dto.CreatePostRequest:
    properties:
      body:
        maxLength: 10000
        minLength: 10
        type: string
      event_date:
        type: string
      image_url:
        type: string
      links:
        items:
          type: string
        type: array
      location:
        type: string
      pinned:
        type: integer
      programs:
        items:
          type: string
        type: array
      tags:
        items:
          type: string
        type: array
      title:
        maxLength: 255
        minLength: 3
        type: string
      type:
        enum:
        - forum
        - news
        - event
        type: string
    required:
    - body
    - title
    type: object
  dto.CsrfResponse:
    properties:
      csrf:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  dto.EventResponse:
    properties:
      cover_path:
        type: string
      created_at:
        type: string
      id:
        type: string
      title:
        type: string
    type: object
  dto.ExamResponse:
    properties:
      comment:
        type: string
      edit_version:
        type: integer
      exam_date:
        type: string
      group_id:
        type: string
      id:
        type: string
      is_latest:
        type: integer
      module_name:
        type: string
      moduleid:
        type: string
      programid:
        type: string
      uploaded_at:
        type: string
      uploader_name:
        type: string
      version:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: user@studmail.w-hs.de
        type: string
      password:
        example: secret123
        maxLength: 72
        minLength: 8
        type: string
      remember:
        type: boolean
    required:
    - email
    - password
    type: object
  dto.MediaResponse:
    properties:
      description:
        type: string
      event_id:
        type: string
      id:
        type: string
      mime_type:
        type: string
      title:
        type: string
      uploaded_at:
        type: string
      uploader_name:
        type: string
    type: object
  dto.ModuleResponse:
    properties:
      alias:
        type: string
      id:
        type: string
      name:
        type: string
      programid:
        type: string
    type: object
  dto.NotificationResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      link:
        type: string
      message:
        type: string
      read:
        type: boolean
      title:
        type: string
      type:
        type: string
    type: object
  dto.PostResponse:
    properties:
      active:
        type: integer
      author_avatar_url:
        type: string
      author_id:
        type: string
      author_name:
        type: string
      body:
        type: string
      comment_count:
        type: integer
      created_at:
        type: string
      event_date:
        type: string
      id:
        type: string
      image_url:
        type: string
      links:
        items:
          type: string
        type: array
      location:
        type: string
      pinned:
        type: integer
      programs:
        items:
          type: string
        type: array
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      type:
        type: string
      updated_at:
        type: string
      user_vote:
        type: integer
      votes:
        type: integer
    type: object
  dto.ProgramResponse:
    properties:
      id:
        type: string
      name:
        type: string
      versions:
        items:
          type: string
        type: array
    type: object
  dto.PublicUserResponse:
    properties:
      active:
        type: integer
      avatar_url:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      private:
        type: integer
      programid:
        type: string
      role:
        type: string
      theme:
        type: string
      verified:
        type: integer
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: user@studmail.w-hs.de
        type: string
      name:
        example: Max Mustermann
        maxLength: 64
        minLength: 2
        type: string
      password:
        example: secret123
        maxLength: 72
        minLength: 8
        type: string
      programid:
        type: string
    required:
    - email
    - name
    - password
    - programid
    type: object
  dto.SearchResult:
    properties:
      id:
        type: string
      subtitle:
        type: string
      title:
        type: string
      type:
        description: '"exam" or "module" or "user" or "post"'
        type: string
      url:
        type: string
    type: object
  dto.UpdateExamRequest:
    properties:
      comment:
        maxLength: 1000
        type: string
      date:
        type: string
      moduleid:
        type: string
      programid:
        type: string
      version:
        maxLength: 32
        minLength: 2
        type: string
    required:
    - date
    - moduleid
    - programid
    - version
    type: object
  dto.UpdateProfileRequest:
    properties:
      name:
        example: Max Mustermann
        maxLength: 64
        minLength: 2
        type: string
      private:
        type: boolean
      programid:
        type: string
      theme:
        enum:
        - light
        - dark
        - system
        example: dark
        type: string
    required:
    - name
    - programid
    - theme
    type: object
  dto.UserResponse:
    properties:
      active:
        type: integer
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      private:
        type: integer
      programid:
        type: string
      role:
        type: string
      theme:
        type: string
      verified:
        type: integer
    type: object
  dto.VoteRequest:
    properties:
      vote:
        enum:
        - 1
        - -1
        - 0
        type: integer
    type: object
info:
  contact: {}
  description: API for the website of the FSV Informatik
  title: Fachschaft Informatik API
  version: "1.0"
paths:
  /activities:
    get:
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ActivityResponse'
            type: array
      summary: List all activities
      tags:
      - Activities
  /auth/avatars/{userId}/{filename}:
    get:
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      - description: Filename
        in: path
        name: filename
        required: true
        type: string
      produces:
      - image/svg+xml
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Get user avatar
      tags:
      - Auth
  /auth/csrf:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CsrfResponse'
      summary: Issue CSRF token
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Log in
      tags:
      - Auth
  /auth/logout:
    post:
      parameters:
      - description: CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Log out
      tags:
      - Auth
  /auth/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
      summary: Get current user
      tags:
      - Auth
    put:
      consumes:
      - application/json
      parameters:
      - description: Update Profile Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Update current user profile
      tags:
      - Auth
  /auth/notifications:
    get:
      operationId: getAuthNotifications
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.NotificationResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List notifications
      tags:
      - Auth
  /auth/notifications/{id}/read:
    put:
      operationId: putAuthNotificationsIdRead
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.NotificationResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Mark notification as read
      tags:
      - Auth
  /auth/notifications/read-all:
    put:
      operationId: putAuthNotificationsReadAll
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Mark all notifications as read
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Register a user
      tags:
      - Auth
  /auth/verify:
    get:
      parameters:
      - description: Verification Token
        in: query
        name: token
        required: true
        type: string
      responses:
        "302":
          description: Found
      summary: Verify user email
      tags:
      - Auth
  /events:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.EventResponse'
            type: array
      summary: List events
      tags:
      - Media
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Event Title
        in: formData
        name: title
        required: true
        type: string
      - description: Cover Image
        in: formData
        name: file
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.EventResponse'
      summary: Create event
      tags:
      - Media
  /events/{id}/cover:
    get:
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Get event cover
      tags:
      - Media
  /exams:
    get:
      operationId: getExams
      parameters:
      - description: Program ID
        in: query
        name: programid
        type: string
      - description: Version
        in: query
        name: version
        type: string
      - description: Module ID
        in: query
        name: moduleid
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ExamResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List exams
      tags:
      - Exams
    post:
      consumes:
      - multipart/form-data
      description: Upload a PDF and assign it to one or more modules
      operationId: postExams
      parameters:
      - description: CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Exam PDF
        in: formData
        name: file
        required: true
        type: file
      - description: Exam Date (YYYY-MM-DD)
        in: formData
        name: date
        required: true
        type: string
      - description: 'JSON array of assignments: [{''programid'':1, ''version'':''PO2016'',
          ''moduleid'':10}]'
        in: formData
        name: assignments
        required: true
        type: string
      - description: Optional comment
        in: formData
        name: comment
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Upload exam
      tags:
      - Exams
  /exams/{id}:
    delete:
      operationId: deleteExamsId
      parameters:
      - description: Exam ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete exam
      tags:
      - Exams
    get:
      operationId: getExamsId
      parameters:
      - description: Exam ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ExamResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get exam details
      tags:
      - Exams
    put:
      operationId: putExamsId
      parameters:
      - description: Exam ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateExamRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ExamResponse'
      summary: Update exam
      tags:
      - Exams
  /exams/{id}/file:
    get:
      operationId: getExamsFile
      parameters:
      - description: Exam ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Download file
      tags:
      - Exams
  /exams/versions/{groupId}:
    get:
      operationId: getExamVersions
      parameters:
      - description: Exam Group ID
        in: path
        name: groupId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ExamResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List exam versions
      tags:
      - Exams
  /forum/comments/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      - description: Comment Content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CommentResponse'
      summary: Update comment
      tags:
      - Forum
  /forum/comments/{id}/vote:
    post:
      consumes:
      - application/json
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      - description: Vote Value
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VoteRequest'
      responses:
        "204":
          description: No Content
      summary: Vote for comment
      tags:
      - Forum
  /forum/posts:
    get:
      parameters:
      - description: Post type (forum, news, event)
        in: query
        name: type
        type: string
      - description: Search query
        in: query
        name: query
        type: string
      - description: Sort by (new, votes)
        in: query
        name: sort
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PostResponse'
            type: array
      summary: List forum posts
      tags:
      - Forum
    post:
      consumes:
      - application/json
      parameters:
      - description: Post Content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.PostResponse'
      summary: Create forum post
      tags:
      - Forum
  /forum/posts/{id}:
    delete:
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete forum post
      tags:
      - Forum
    get:
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PostResponse'
      summary: Get forum post
      tags:
      - Forum
    put:
      consumes:
      - application/json
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      - description: Post Content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PostResponse'
      summary: Update forum post
      tags:
      - Forum
  /forum/posts/{id}/comments:
    get:
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CommentResponse'
            type: array
      summary: List comments for post
      tags:
      - Forum
    post:
      consumes:
      - application/json
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      - description: Comment Content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CommentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CommentResponse'
      summary: Add comment to post
      tags:
      - Forum
  /forum/posts/{id}/vote:
    post:
      consumes:
      - application/json
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      - description: Vote Value
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VoteRequest'
      responses:
        "204":
          description: No Content
      summary: Vote for post
      tags:
      - Forum
  /media:
    get:
      parameters:
      - description: Event ID
        in: query
        name: event_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.MediaResponse'
            type: array
      summary: List media
      tags:
      - Media
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Event ID
        in: formData
        name: event_id
        required: true
        type: string
      - description: Title
        in: formData
        name: title
        type: string
      - description: Description
        in: formData
        name: description
        type: string
      - description: Media File
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Upload media
      tags:
      - Media
  /media/{id}:
    get:
      parameters:
      - description: Media ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MediaResponse'
      summary: Get media by ID
      tags:
      - Media
  /media/{id}/file:
    get:
      parameters:
      - description: Media ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Get media file
      tags:
      - Media
  /media/{id}/preview:
    get:
      parameters:
      - description: Media ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Get media preview
      tags:
      - Media
  /programs:
    get:
      consumes:
      - application/json
      description: Returns a list of study programs and their valid PO versions
      operationId: getPrograms
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ProgramResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List all programs
      tags:
