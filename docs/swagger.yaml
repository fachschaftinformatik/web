basePath: /api
definitions:
  auth.CommentRequest:
    properties:
      parent_id:
        type: string
      text:
        type: string
    type: object
  auth.CommentResponse:
    properties:
      active:
        type: integer
      author_avatar_url:
        type: string
      author_id:
        type: string
      author_name:
        type: string
      created_at:
        type: string
      id:
        type: string
      parent_id:
        type: string
      post_id:
        type: string
      text:
        type: string
      updated_at:
        type: string
      user_vote:
        type: integer
      votes:
        type: integer
    type: object
  auth.CreatePostRequest:
    properties:
      body:
        type: string
      event_date:
        type: string
      image_url:
        type: string
      links:
        items:
          type: string
        type: array
      location:
        type: string
      pinned:
        type: integer
      programs:
        items:
          type: string
        type: array
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      type:
        type: string
    type: object
  auth.CsrfResponse:
    properties:
      csrf:
        type: string
    type: object
  auth.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  auth.ExamResponse:
    description: Exam details
    properties:
      comment:
        type: string
      edit_version:
        type: integer
      exam_date:
        example: "2023-01-15"
        format: date
        type: string
      group_id:
        type: string
      id:
        type: string
      is_latest:
        type: integer
      module_name:
        type: string
      moduleid:
        type: integer
      programid:
        type: integer
      uploaded_at:
        type: string
      uploader_name:
        type: string
      version:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: user@studmail.w-hs.de
        type: string
      password:
        example: secret123
        type: string
    type: object
  auth.ModuleResponse:
    description: A study module
    properties:
      alias:
        type: string
      id:
        type: integer
      name:
        type: string
      programid:
        type: integer
    type: object
  auth.NotificationResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      link:
        type: string
      message:
        type: string
      read:
        type: boolean
      title:
        type: string
      type:
        type: string
    type: object
  auth.PostResponse:
    properties:
      active:
        type: integer
      author_avatar_url:
        type: string
      author_id:
        type: string
      author_name:
        type: string
      body:
        type: string
      comment_count:
        type: integer
      created_at:
        type: string
      event_date:
        type: string
      id:
        type: string
      image_url:
        type: string
      links:
        type: string
      location:
        type: string
      pinned:
        type: integer
      programs:
        type: string
      tags:
        type: string
      title:
        type: string
      type:
        type: string
      updated_at:
        type: string
      user_vote:
        type: integer
      votes:
        type: integer
    type: object
  auth.ProgramResponse:
    description: A study program including valid PO versions
    properties:
      id:
        type: integer
      name:
        type: string
      versions:
        items:
          type: string
        type: array
    type: object
  auth.PublicUserResponse:
    properties:
      active:
        type: integer
      avatar_url:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      private:
        type: integer
      programid:
        type: integer
      role:
        type: string
      theme:
        type: string
      verified:
        type: integer
    type: object
  auth.RegisterRequest:
    properties:
      email:
        example: user@studmail.w-hs.de
        type: string
      name:
        example: Max Mustermann
        type: string
      password:
        example: secret123
        type: string
      programid:
        example: 1
        type: integer
    type: object
  auth.SearchResult:
    properties:
      id:
        type: string
      subtitle:
        type: string
      title:
        type: string
      type:
        description: '"exam" or "module"'
        type: string
      url:
        type: string
    type: object
  auth.UpdateExamRequest:
    properties:
      comment:
        type: string
      date:
        type: string
      moduleid:
        type: integer
      programid:
        type: integer
      version:
        type: string
    type: object
  auth.UpdateProfileRequest:
    properties:
      name:
        example: Max Mustermann
        type: string
      private:
        type: boolean
      programid:
        example: 1
        type: integer
      theme:
        example: dark
        type: string
    type: object
  auth.UserResponse:
    description: User account information
    properties:
      active:
        type: integer
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      password:
        type: string
      private:
        type: integer
      programid:
        type: integer
      role:
        type: string
      theme:
        type: string
      updated_at:
        type: string
      verification_token:
        type: string
      verified:
        type: integer
      verified_at:
        type: string
      verified_until:
        type: string
    type: object
  auth.VoteRequest:
    properties:
      vote:
        description: 1 or -1
        type: integer
    type: object
  database.Activity:
    properties:
      created_at:
        type: string
      id:
        type: string
      target_id:
        type: string
      target_name:
        type: string
      type:
        type: string
      user_id:
        type: string
    type: object
  database.ForumComment:
    properties:
      active:
        type: integer
      author_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      parent_id:
        type: string
      post_id:
        type: string
      text:
        type: string
      updated_at:
        type: string
    type: object
  database.ForumPost:
    properties:
      active:
        type: integer
      author_id:
        type: string
      body:
        type: string
      created_at:
        type: string
      event_date:
        type: string
      id:
        type: string
      image_url:
        type: string
      links:
        type: string
      location:
        type: string
      pinned:
        type: integer
      programs:
        type: string
      tags:
        type: string
      title:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: API for the website of the FSV Informatik
  title: Fachschaft Informatik API
  version: "1.0"
paths:
  /activities:
    get:
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.Activity'
            type: array
      summary: List all activities
      tags:
      - Activities
  /auth/avatars/{userId}/{filename}:
    get:
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      - description: Filename
        in: path
        name: filename
        required: true
        type: string
      produces:
      - image/svg+xml
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Get user avatar
      tags:
      - Auth
  /auth/csrf:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.CsrfResponse'
      summary: Issue CSRF token
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Log in
      tags:
      - Auth
  /auth/logout:
    post:
      parameters:
      - description: CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Log out
      tags:
      - Auth
  /auth/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
      summary: Get current user
      tags:
      - Auth
    put:
      consumes:
      - application/json
      parameters:
      - description: Update Profile Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Update current user profile
      tags:
      - Auth
  /auth/notifications:
    get:
      operationId: getAuthNotifications
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.NotificationResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: List notifications
      tags:
      - Auth
  /auth/notifications/{id}/read:
    put:
      operationId: putAuthNotificationsIdRead
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.NotificationResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Mark notification as read
      tags:
      - Auth
  /auth/notifications/read-all:
    put:
      operationId: putAuthNotificationsReadAll
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Mark all notifications as read
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Register a user
      tags:
      - Auth
  /auth/verify:
    get:
      parameters:
      - description: Verification Token
        in: query
        name: token
        required: true
        type: string
      responses:
        "302":
          description: Found
      summary: Verify user email
      tags:
      - Auth
  /exams:
    get:
      operationId: getExams
      parameters:
      - description: Program ID
        in: query
        name: programid
        type: integer
      - description: Version
        in: query
        name: version
        type: string
      - description: Module ID
        in: query
        name: moduleid
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.ExamResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: List exams
      tags:
      - Exams
    post:
      consumes:
      - multipart/form-data
      description: Upload a PDF and assign it to one or more modules
      operationId: postExams
      parameters:
      - description: CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Exam PDF
        in: formData
        name: file
        required: true
        type: file
      - description: Exam Date (YYYY-MM-DD)
        in: formData
        name: date
        required: true
        type: string
      - description: 'JSON array of assignments: [{''programid'':1, ''version'':''PO2016'',
          ''moduleid'':10}]'
        in: formData
        name: assignments
        required: true
        type: string
      - description: Optional comment
        in: formData
        name: comment
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Upload exam
      tags:
      - Exams
  /exams/{id}:
    delete:
      operationId: deleteExamsId
      parameters:
      - description: Exam ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete exam
      tags:
      - Exams
    get:
      operationId: getExamsId
      parameters:
      - description: Exam ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ExamResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Get exam details
      tags:
      - Exams
    put:
      operationId: putExamsId
      parameters:
      - description: Exam ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.UpdateExamRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ExamResponse'
      summary: Update exam
      tags:
      - Exams
  /exams/{id}/file:
    get:
      operationId: getExamsFile
      parameters:
      - description: Exam ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Download file
      tags:
      - Exams
  /exams/versions/{groupId}:
    get:
      operationId: getExamVersions
      parameters:
      - description: Exam Group ID
        in: path
        name: groupId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.ExamResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: List exam versions
      tags:
      - Exams
  /forum/comments/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      - description: Comment Content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.CommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/database.ForumComment'
      summary: Update comment
      tags:
      - Forum
  /forum/comments/{id}/vote:
    post:
      consumes:
      - application/json
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      - description: Vote Value
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.VoteRequest'
      responses:
        "204":
          description: No Content
      summary: Vote for comment
      tags:
      - Forum
  /forum/posts:
    get:
      parameters:
      - description: Post type (forum, news, event)
        in: query
        name: type
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.PostResponse'
            type: array
      summary: List forum posts
      tags:
      - Forum
    post:
      consumes:
      - application/json
      parameters:
      - description: Post Content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/database.ForumPost'
      summary: Create forum post
      tags:
      - Forum
  /forum/posts/{id}:
    delete:
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete forum post
      tags:
      - Forum
    get:
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.PostResponse'
      summary: Get forum post
      tags:
      - Forum
    put:
      consumes:
      - application/json
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      - description: Post Content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.CreatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/database.ForumPost'
      summary: Update forum post
      tags:
      - Forum
  /forum/posts/{id}/comments:
    get:
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.CommentResponse'
            type: array
      summary: List comments for post
      tags:
      - Forum
    post:
      consumes:
      - application/json
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      - description: Comment Content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.CommentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/database.ForumComment'
      summary: Add comment to post
      tags:
      - Forum
  /forum/posts/{id}/vote:
    post:
      consumes:
      - application/json
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      - description: Vote Value
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.VoteRequest'
      responses:
        "204":
          description: No Content
      summary: Vote for post
      tags:
      - Forum
  /programs:
    get:
      consumes:
      - application/json
      description: Returns a list of study programs and their valid PO versions
      operationId: getPrograms
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.ProgramResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: List all programs
      tags:
      - Programs
  /programs/{id}:
    get:
      operationId: getProgramsId
      parameters:
      - description: Program ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ProgramResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Get program by ID
      tags:
      - Programs
  /programs/{id}/modules:
    get:
      operationId: getProgramModules
      parameters:
      - description: Program ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.ModuleResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: List modules for a program
      tags:
      - Programs
  /search:
    get:
      operationId: getSearch
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.SearchResult'
            type: array
      summary: Global search
      tags:
      - Search
  /users:
    get:
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.UserResponse'
            type: array
      summary: List users
      tags:
      - Users
  /users/{id}:
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.PublicUserResponse'
      summary: Get user profile
      tags:
      - Users
      - Auth
  /users/{id}/activities:
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.Activity'
            type: array
      summary: List user activities
      tags:
      - Activities
swagger: "2.0"
