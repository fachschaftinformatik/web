basePath: /api
definitions:
  auth.CsrfResponse:
    properties:
      csrf:
        type: string
    type: object
  auth.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  auth.ExamResponse:
    description: Exam details
    properties:
      comment:
        type: string
      exam_date:
        example: "2023-01-15"
        format: date
        type: string
      id:
        type: string
      module_name:
        type: string
      moduleid:
        type: integer
      programid:
        type: integer
      uploaded_at:
        type: string
      uploader_name:
        type: string
      version:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: user@studmail.w-hs.de
        type: string
      password:
        example: secret123
        type: string
    type: object
  auth.ModuleResponse:
    description: A study module
    properties:
      id:
        type: integer
      name:
        type: string
      programid:
        type: integer
    type: object
  auth.ProgramResponse:
    description: A study program including valid PO versions
    properties:
      id:
        type: integer
      name:
        type: string
      versions:
        items:
          type: string
        type: array
    type: object
  auth.RegisterRequest:
    properties:
      email:
        example: user@studmail.w-hs.de
        type: string
      name:
        example: Max Mustermann
        type: string
      password:
        example: secret123
        type: string
      programid:
        example: 1
        type: integer
    type: object
  auth.UpdateExamRequest:
    properties:
      comment:
        type: string
      date:
        type: string
      moduleid:
        type: integer
      programid:
        type: integer
      version:
        type: string
    type: object
  auth.UserResponse:
    description: User account information
    properties:
      active:
        type: integer
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      password:
        type: string
      programid:
        type: integer
      role:
        type: string
      updated_at:
        type: string
      verification_token:
        type: string
      verified:
        type: integer
      verified_at:
        type: string
      verified_until:
        type: string
    type: object
info:
  contact: {}
  description: API for the website of the FSV Informatik
  title: Fachschaft Informatik API
  version: "1.0"
paths:
  /auth/csrf:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.CsrfResponse'
      summary: Issue CSRF token
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Log in
      tags:
      - Auth
  /auth/logout:
    post:
      parameters:
      - description: CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Log out
      tags:
      - Auth
  /auth/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
      summary: Get current user
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Register a user
      tags:
      - Auth
  /auth/verify:
    get:
      parameters:
      - description: Verification Token
        in: query
        name: token
        required: true
        type: string
      responses:
        "302":
          description: Found
      summary: Verify user email
      tags:
      - Auth
  /exams:
    get:
      operationId: getExams
      parameters:
      - description: Program ID
        in: query
        name: programid
        type: integer
      - description: Version
        in: query
        name: version
        type: string
      - description: Module ID
        in: query
        name: moduleid
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.ExamResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: List exams
      tags:
      - Exams
    post:
      consumes:
      - multipart/form-data
      description: Upload a PDF and assign it to one or more modules
      operationId: postExams
      parameters:
      - description: CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Exam PDF
        in: formData
        name: file
        required: true
        type: file
      - description: Exam Date (YYYY-MM-DD)
        in: formData
        name: date
        required: true
        type: string
      - description: 'JSON array of assignments: [{''programid'':1, ''version'':''PO2016'',
          ''moduleid'':10}]'
        in: formData
        name: assignments
        required: true
        type: string
      - description: Optional comment
        in: formData
        name: comment
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Upload exam
      tags:
      - Exams
  /exams/{id}:
    delete:
      operationId: deleteExamsId
      parameters:
      - description: Exam ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete exam
      tags:
      - Exams
    put:
      operationId: putExamsId
      parameters:
      - description: Exam ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.UpdateExamRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ExamResponse'
      summary: Update exam
      tags:
      - Exams
  /exams/{id}/file:
    get:
      operationId: getExamsFile
      parameters:
      - description: Exam ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Download file
      tags:
      - Exams
  /programs:
    get:
      consumes:
      - application/json
      description: Returns a list of study programs and their valid PO versions
      operationId: getPrograms
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.ProgramResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: List all programs
      tags:
      - Programs
  /programs/{id}:
    get:
      operationId: getProgramsId
      parameters:
      - description: Program ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ProgramResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Get program by ID
      tags:
      - Programs
  /programs/{id}/modules:
    get:
      operationId: getProgramModules
      parameters:
      - description: Program ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.ModuleResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: List modules for a program
      tags:
      - Programs
  /users:
    get:
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.UserResponse'
            type: array
      summary: List users
      tags:
      - Users
  /users/{id}:
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
      summary: Get user by ID
      tags:
      - Users
swagger: "2.0"
