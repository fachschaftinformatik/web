basePath: /api
definitions:
  dto.ActivityResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      target_id:
        type: string
      target_name:
        type: string
      type:
        type: string
      user_id:
        type: string
      user_name:
        type: string
    type: object
  dto.AdminDashboardResponse:
    properties:
      activity_trend:
        items:
          $ref: '#/definitions/dto.DashboardTrendItem'
        type: array
      discussion_growth_trend:
        items:
          $ref: '#/definitions/dto.DashboardTrendItem'
        type: array
      exam_growth_trend:
        items:
          $ref: '#/definitions/dto.DashboardTrendItem'
        type: array
      module_growth_trend:
        items:
          $ref: '#/definitions/dto.DashboardTrendItem'
        type: array
      program_distribution:
        items:
          $ref: '#/definitions/dto.ProgramDistributionItem'
        type: array
      program_growth_trend:
        items:
          $ref: '#/definitions/dto.DashboardTrendItem'
        type: array
      recent_activities:
        items:
          $ref: '#/definitions/dto.ActivityResponse'
        type: array
      session_trend:
        items:
          $ref: '#/definitions/dto.DashboardTrendItem'
        type: array
      stats:
        $ref: '#/definitions/dto.AdminStatsResponse'
      user_growth_trend:
        items:
          $ref: '#/definitions/dto.DashboardTrendItem'
        type: array
    type: object
  dto.AdminStatsResponse:
    properties:
      activity_count:
        type: integer
      archive_count:
        type: integer
      event_count:
        type: integer
      module_count:
        type: integer
      post_count:
        type: integer
      program_count:
        type: integer
      session_count:
        type: integer
      user_count:
        type: integer
    type: object
  dto.ArchiveEntryResponse:
    properties:
      comment:
        type: string
      created_at:
        type: string
      edit_version:
        type: integer
      exam_date:
        type: string
      file_id:
        type: string
      id:
        type: string
      module_id:
        type: string
      module_name:
        type: string
      program_id:
        type: string
      uploader_name:
        type: string
      version:
        type: string
    type: object
  dto.CreateDiscussionPostRequest:
    properties:
      body:
        maxLength: 10000
        minLength: 10
        type: string
      event_date:
        type: string
      image_url:
        type: string
      links:
        items:
          $ref: '#/definitions/dto.Link'
        type: array
      location:
        type: string
      pinned:
        type: boolean
      programs:
        items:
          type: string
        type: array
      tags:
        items:
          type: string
        type: array
      title:
        maxLength: 255
        minLength: 3
        type: string
      type:
        enum:
        - discussion
        - news
        - event
        type: string
    required:
    - body
    - title
    type: object
  dto.CsrfResponse:
    properties:
      csrf:
        type: string
      signups_enabled:
        type: boolean
    type: object
  dto.DashboardTrendItem:
    properties:
      count:
        type: integer
      date:
        type: string
    type: object
  dto.DiscussionCommentRequest:
    properties:
      parent_id:
        type: string
      text:
        maxLength: 2000
        minLength: 1
        type: string
    required:
    - text
    type: object
  dto.DiscussionCommentResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      parent_id:
        type: string
      post_id:
        type: string
      text:
        type: string
      updated_at:
        type: string
      user_avatar_url:
        type: string
      user_id:
        type: string
      user_name:
        type: string
      user_vote:
        type: integer
      votes:
        type: integer
    type: object
  dto.DiscussionPostResponse:
    properties:
      body:
        type: string
      comment_count:
        type: integer
      created_at:
        type: string
      event_date:
        type: string
      id:
        type: string
      image_url:
        type: string
      links:
        items:
          $ref: '#/definitions/dto.Link'
        type: array
      location:
        type: string
      pinned:
        type: integer
      programs:
        items:
          $ref: '#/definitions/dto.PostProgramResponse'
        type: array
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      type:
        type: string
      updated_at:
        type: string
      user_avatar_url:
        type: string
      user_id:
        type: string
      user_name:
        type: string
      user_vote:
        type: integer
      votes:
        type: integer
    type: object
  dto.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  dto.EventResponse:
    properties:
      cover_path:
        type: string
      created_at:
        type: string
      id:
        type: string
      title:
        type: string
    type: object
  dto.Link:
    properties:
      label:
        type: string
      url:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: user@fsv-wh.de
        type: string
      password:
        example: secret123
        maxLength: 72
        minLength: 8
        type: string
      remember:
        type: boolean
    required:
    - email
    - password
    type: object
  dto.MediaResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      event_id:
        type: string
      id:
        type: string
      mime_type:
        type: string
      title:
        type: string
      uploader_name:
        type: string
    type: object
  dto.ModuleResponse:
    properties:
      alias:
        type: string
      id:
        type: string
      name:
        type: string
      program_id:
        type: string
    type: object
  dto.NotificationResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      link:
        type: string
      message:
        type: string
      read:
        type: boolean
      title:
        type: string
      type:
        type: string
      user_id:
        type: string
    type: object
  dto.OfficeStatusResponse:
    properties:
      occupied:
        type: boolean
    type: object
  dto.PostProgramResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  dto.ProgramDistributionItem:
    properties:
      name:
        type: string
      value:
        type: integer
    type: object
  dto.ProgramResponse:
    properties:
      id:
        type: string
      name:
        type: string
      versions:
        items:
          type: string
        type: array
    type: object
  dto.PublicUserResponse:
    properties:
      active:
        type: integer
      avatar_url:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      private:
        type: integer
      program_id:
        type: string
      role:
        type: string
      theme:
        type: string
      verified:
        type: integer
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: user@fsv-wh.de
        type: string
      name:
        example: Max Mustermann
        maxLength: 64
        minLength: 2
        type: string
      password:
        example: secret123
        maxLength: 72
        minLength: 8
        type: string
      program_id:
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.SearchResult:
    properties:
      id:
        type: string
      subtitle:
        type: string
      title:
        type: string
      type:
        description: '"archive" or "module" or "user" or "discussion"'
        type: string
      url:
        type: string
    type: object
  dto.UpdateArchiveEntryRequest:
    properties:
      comment:
        maxLength: 1000
        type: string
      date:
        type: string
      module_id:
        type: string
      version:
        maxLength: 32
        minLength: 2
        type: string
    required:
    - date
    - module_id
    - version
    type: object
  dto.UpdateOfficeStatusRequest:
    properties:
      occupied:
        type: boolean
    type: object
  dto.UpdateProfileRequest:
    properties:
      name:
        example: Max Mustermann
        maxLength: 64
        minLength: 2
        type: string
      private:
        type: boolean
      program_id:
        type: string
      theme:
        enum:
        - light
        - dark
        - system
        example: dark
        type: string
    required:
    - name
    - theme
    type: object
  dto.UserResponse:
    properties:
      active:
        type: integer
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      private:
        type: integer
      program_id:
        type: string
      role:
        type: string
      theme:
        type: string
      verified:
        type: integer
    type: object
  dto.VoteRequest:
    properties:
      vote:
        enum:
        - 1
        - -1
        - 0
        type: integer
    type: object
info:
  contact: {}
  description: API for the website of the FSV Informatik
  title: Fachschaft Informatik API
  version: "1.0"
paths:
  /activities:
    get:
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ActivityResponse'
            type: array
      summary: List all activities
      tags:
      - Activities
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AdminDashboardResponse'
      summary: Get admin dashboard data
      tags:
      - Admin
  /admin/modules:
    post:
      consumes:
      - application/json
      parameters:
      - description: Module Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ModuleResponse'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ModuleResponse'
      summary: Create a module
      tags:
      - Admin
  /admin/programs:
    post:
      consumes:
      - application/json
      parameters:
      - description: Program Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ProgramResponse'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ProgramResponse'
      summary: Create a program
      tags:
      - Admin
  /admin/ref/discussion-types:
    get:
      operationId: getAdminRefDiscussionTypes
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: Get all discussion types
      tags:
      - Admin
  /admin/ref/roles:
    get:
      operationId: getAdminRefRoles
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: Get all user roles
      tags:
      - Admin
  /admin/stats:
    get:
      operationId: getAdminStats
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AdminStatsResponse'
      summary: Get admin dashboard stats
      tags:
      - Admin
  /archive:
    get:
      operationId: getArchive
      parameters:
      - description: Program ID
        in: query
        name: program_id
        type: string
      - description: Version
        in: query
        name: version
        type: string
      - description: Module ID
        in: query
        name: module_id
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ArchiveEntryResponse'
            type: array
      summary: List archive entries
      tags:
      - Archive
    post:
      consumes:
      - multipart/form-data
      operationId: postArchive
      parameters:
      - description: CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Exam PDF
        in: formData
        name: file
        required: true
        type: file
      - description: Exam Date (YYYY-MM-DD)
        in: formData
        name: date
        type: string
      - description: Module ID
        in: formData
        name: module_id
        type: string
      - description: PO Version
        in: formData
        name: version
        type: string
      - description: Optional specific group ID to add revision to
        in: formData
        name: group_id
        type: string
      - description: Optional comment
        in: formData
        name: comment
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ArchiveEntryResponse'
      summary: Upload archive entry
      tags:
      - Archive
  /archive/{entryId}:
    delete:
      operationId: deleteArchiveId
      parameters:
      - description: Entry ID
        in: path
        name: entryId
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete archive entry
      tags:
      - Archive
    get:
      operationId: getArchiveId
      parameters:
      - description: Entry ID
        in: path
        name: entryId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ArchiveEntryResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get archive entry details
      tags:
      - Archive
    put:
      operationId: putArchiveId
      parameters:
      - description: Entry ID
        in: path
        name: entryId
        required: true
        type: string
      - description: Update Data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateArchiveEntryRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ArchiveEntryResponse'
      summary: Update archive entry (new version)
      tags:
      - Archive
  /archive/{entryId}/file:
    get:
      operationId: getArchiveFile
      parameters:
      - description: Entry ID
        in: path
        name: entryId
        required: true
        type: string
      - description: Specific File ID (ignored in simple mode)
        in: query
        name: file_id
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Download archive file
      tags:
      - Archive
  /archive/{entryId}/versions:
    get:
      operationId: getArchiveVersions
      parameters:
      - description: Entry ID
        in: path
        name: entryId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ArchiveEntryResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List archive entry versions
      tags:
      - Archive
  /archive/files/{fileId}:
    delete:
      operationId: deleteArchiveFile
      parameters:
      - description: File ID
        in: path
        name: fileId
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete a specific archive file version
      tags:
      - Archive
  /auth/avatars/{userId}/{filename}:
    get:
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      - description: Filename
        in: path
        name: filename
        required: true
        type: string
      - description: Size (ignored, always serves source)
        in: query
        name: size
        type: integer
      produces:
      - image/svg+xml
      - image/jpeg
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Get user avatar
      tags:
      - Auth
  /auth/csrf:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CsrfResponse'
      summary: Issue CSRF token
      tags:
      - Auth
  /auth/forgot:
    post:
      consumes:
      - application/json
      parameters:
      - description: '{email: string}'
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Request password reset
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Log in
      tags:
      - Auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Log out
      tags:
      - Auth
  /auth/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
      summary: Get current user
      tags:
      - Auth
    put:
      consumes:
      - application/json
      parameters:
      - description: Update Profile Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Update current user profile
      tags:
      - Auth
  /auth/me/avatar:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Avatar Image
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
      summary: Upload avatar
      tags:
      - Auth
  /auth/notifications:
    get:
      operationId: getAuthNotifications
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.NotificationResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List notifications
      tags:
      - Auth
  /auth/notifications/{notificationId}/read:
    put:
      operationId: putAuthNotificationsIdRead
      parameters:
      - description: Notification ID
        in: path
        name: notificationId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.NotificationResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Mark notification as read
      tags:
      - Auth
  /auth/notifications/read-all:
    put:
      operationId: putAuthNotificationsReadAll
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Mark all notifications as read
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Register a user
      tags:
      - Auth
  /auth/reset:
    post:
      consumes:
      - application/json
      parameters:
      - description: '{token: string, password: string}'
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Reset password
      tags:
      - Auth
  /auth/verify:
    get:
      parameters:
      - description: Verification Token
        in: query
        name: token
        required: true
        type: string
      responses:
        "302":
          description: Found
      summary: Verify user email
      tags:
      - Auth
  /discussions:
    get:
      parameters:
      - description: Post type (discussion, news, event)
        in: query
        name: type
        type: string
      - description: Program ID filter
        in: query
        name: program_id
        type: string
      - description: Search query
        in: query
        name: query
        type: string
      - description: Sort by (new, votes)
        in: query
        name: sort
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.DiscussionPostResponse'
            type: array
      summary: List discussion posts
      tags:
      - Discussions
    post:
      consumes:
      - application/json
      parameters:
      - description: Post Content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDiscussionPostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.DiscussionPostResponse'
      summary: Create discussion post
      tags:
      - Discussions
  /discussions/{postId}:
    delete:
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete discussion post
      tags:
      - Discussions
    get:
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DiscussionPostResponse'
      summary: Get discussion post
      tags:
      - Discussions
    put:
      consumes:
      - application/json
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      - description: Post Content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDiscussionPostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DiscussionPostResponse'
      summary: Update discussion post
      tags:
      - Discussions
