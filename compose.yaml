networks:
  api:

volumes:
  buckets:
  database:

services:
  api:
    build:
      context: .
    restart: always
    ports:
      - 8080:80
    volumes:
      - database:/data
    networks:
      - api
    environment:
      - DOMAIN=http://localhost:5173
      - SIGNUPS_VERIFY=true
      - SIGNUPS_DOMAINS_WHITELIST=studmail.w-hs.de
      - S3_ENDPOINT=minio:9000
      - S3_BUCKET=development
      - S3_USE_SSL=false
      - S3_ACCESS_KEY=minio
      - S3_SECRET_KEY=password
      # - S3_REGION=eu-central
      # - SMTP_HOST=smtp.example
      # - SMTP_PORT=587
      # - SMTP_USERNAME=user@mail.example
      # - SMTP_PASSWORD=supersecretpassword
      # - SMTP_FROM=user@mail.example
      # depends_on:
      #   minio:
      #     condition: service_healthy
  minio:
    image: minio/minio
    restart: on-failure
    command: server /data --console-address ":9001"
    volumes:
      - buckets:/data
    networks:
      - api
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: password
    # healthcheck:
    #   test: [ "CMD", "mc", "ready", "local" ]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 5
