openapi: 3.1.2
info:
  title: api
  version: 0.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

security:
  - cookieAuth: []

paths:
  /auth/csrf:
    get:
      operationId: getAuthCsrf
      tags: [Auth]
      summary: Issue a CSRF token
      security: []
      responses:
        '200':
          description: CSRF token issued
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                type: object
                required: [csrf]
                properties:
                  csrf:
                    type: string

  /auth/register:
    post:
      operationId: postAuthRegister
      tags: [Auth]
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify:
    get:
      operationId: getAuthVerify
      tags: [Auth]
      summary: Verify user email
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [Auth]
      summary: Log out
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Logged out
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [Auth]
      summary: Get current user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    get:
      operationId: getUsersId
      tags: [Users]
      summary: Get user by id
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users:
    get:
      operationId: getUsers
      tags: [Users]
      summary: List users (restricted)
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 256, default: 32 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /programs:
    get:
      operationId: getPrograms
      tags: [Programs]
      summary: List all programs and their valid POs
      security: []
      responses:
        '200':
          description: List of programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Program'

  /programs/{id}:
    get:
      operationId: getProgramsId
      tags: [Programs]
      summary: Get program by id
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Program
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /programs/{id}/modules:
    get:
      operationId: getProgramModules
      tags: [Programs, Modules]
      summary: List modules for a program
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Module'

  /exams:
    get:
      operationId: getExams
      tags: [Exams]
      summary: List exams
      security:
        - cookieAuth: []
      parameters:
        - name: programid
          in: query
          schema: { type: integer }
        - name: version
          in: query
          schema: { type: string }
        - name: moduleid
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: List of exams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExamListEntry'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: postExams
      tags: [Exams]
      summary: Upload an exam
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, date, assignments]
              properties:
                file:
                  type: string
                  format: binary
                date:
                  type: string
                  format: date
                assignments:
                  type: string
                  description: "JSON string of list of {programid, version, moduleid}"
                comment:
                  type: string
      responses:
        '201':
          description: Exam uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamListEntry'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exams/{id}:
    put:
      operationId: putExamsId
      tags: [Exams]
      summary: Update an exam assignment
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [programid, version, moduleid, date]
              properties:
                programid:
                  type: integer
                version:
                  type: string
                moduleid:
                  type: integer
                date:
                  type: string
                  format: date
                comment:
                  type: string
      responses:
        '200':
          description: Exam updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamListEntry'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteExamsId
      tags: [Exams]
      summary: Delete an exam
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Exam deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exams/{id}/file:
    get:
      operationId: getExamsFile
      tags: [Exams]
      summary: Download exam file
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: File content
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-session

  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string

  headers:
    SetCookie:
      schema:
        type: string

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }

    Program:
      type: object
      required: [id, name, versions]
      properties:
        id:   { type: integer }
        name: { type: string }
        versions:
          type: array
          items:
            type: string
          description: "List of valid POs for this program (e.g. PO2016, PO2023)"

    Module:
      type: object
      required: [id, programid, name]
      properties:
        id: { type: integer }
        programid: { type: integer }
        name: { type: string }

    ExamListEntry:
      type: object
      properties:
        id: { type: string }
        programid: { type: integer }
        version: { type: string }
        moduleid: { type: integer }
        module_name: { type: string }
        exam_date: { type: string, format: date }
        uploaded_at: { type: string, format: date-time }
        uploader_name: { type: string }
        comment: { type: string }

    User:
      type: object
      required:
        [ id, email, name, role, active, verified, programid, created_at, updated_at ]
      properties:
        id:          { type: string, description: "Version 4 UUID" }
        email:       { type: string, format: email }
        name:        { type: string }
        role:
          type: string
          enum: [user, editor, admin]
          default: user
        active:      { type: integer, enum: [0,1] }
        verified:    { type: integer, enum: [0,1] }
        verified_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        verified_until:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        programid:    { type: integer }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }

    UserRegister:
      type: object
      required: [email, name, password, programid]
      properties:
        email:        { type: string, format: email }
        name:         { type: string, minLength: 1 }
        password:     { type: string, minLength: 16 }
        programid:    { type: integer }

    UserLogin:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string }

    Session:
      type: object
      required: [ id, userid, created_at, last_seen, expires_at ]
      properties:
        id:         { type: string, description: "opaque" }
        userid:     { type: string }
        created_at: { type: string, format: date-time }
        last_seen:  { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
